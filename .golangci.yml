run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck       # unchecked errors
    - gosimple       # simplification suggestions
    - govet          # go vet checks
    - ineffassign    # detects unused variable assignments
    - staticcheck    # static analysis
    - unused         # unused code
    - gofmt          # formatting
    - goimports      # import ordering
    - misspell       # spelling mistakes
    - gocritic       # code style
    - noctx          # HTTP requests without context
    - bodyclose      # HTTP response body not closed
    - revive         # fast, configurable linter
    - exhaustive     # exhaustive switch statements
    - prealloc       # slice preallocation

linters-settings:
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-strings
      - name: increment-decrement
      - name: range
      - name: time-naming

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style

  exhaustive:
    default-signifies-exhaustive: true

  misspell:
    locale: US

issues:
  exclude-rules:
    # Test files — allow more relaxed rules.
    - path: _test\.go
      linters:
        - errcheck
        - gocritic

    # Generated or vendor code.
    - path: vendor/
      linters:
        - all

  max-issues-per-linter: 50
  max-same-issues: 10
